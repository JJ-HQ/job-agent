# Réglages de job-agent. Copier en config.yml (non versionné) et adapter.
# Aucun secret ici : les clés vont dans .env.

recherche:
  # Une recherche est lancée par intitulé et par lieu.
  intitules:
    - "Technicien Informatique"
    - "Technicien Support N1"
    - "Technicien Support N2"
    - "Technicien Proximité"
  # À COMPLÉTER dans config.yml : votre ville (ou plusieurs)
  lieux: []
  rayon_km: 50
  contrats: tous          # tous | CDI | CDD | intérim | freelance | stage | alternance
  teletravail: tous       # tous | oui | non
  anciennete_max_jours: 14
  mots_exclus: []         # une offre contenant un de ces mots est écartée

sources:
  adzuna: true
  jooble: true
  france_travail: false   # module pas encore écrit

scoring:
  ollama_url: "http://192.168.20.224:11434"
  modele: ""              # À FIXER après comparaison de 2-3 modèles (voir SPEC.md, phase 1b)
  offres_max_par_jour: 40

resume:
  meilleures_offres: 5
  score_minimum: 50
